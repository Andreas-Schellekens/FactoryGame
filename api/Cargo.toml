[package]
name = "selene-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "json"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
rquickjs = { version = "0.9", features = ["loader"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
